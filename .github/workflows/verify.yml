name: Verify DeskPace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline motion regressions
        run: ./Tests/verify-motion.sh --offline
      - name: Build and verify the universal app
        run: ./build.sh
